[package]
name = "wind-merge"
version = "0.1.0"
edition = "2024"

[lib]
name = "wind_merge"
path = "src/lib/lib.rs"

[dependencies]
netcdf-sys = "0.9"
netcdf = "0.12.0"
libc = "0.2"
rocket = "0.5.1"
dashmap = "6.1.0"
tokio = { version = "1.51.1", features = ["io-util", "process", "sync"] }

[patch.crates-io]
netcdf = { path = "vendor/netcdf" }
